name: RTL CI

# 每次 push / PR 自动跑 rtl/sim 的静态检查与全量回归。
#
# 【为什么只跑这些】
#   iverilog + verilator 在 Ubuntu 上 apt 就能装，2 分钟跑完。
#   Vivado 综合**不在 CI 里** —— GitHub 的 runner 上没有 license。
#   所以分工是：
#     CI      : 功能对不对（22 项逐位对拍 + 静态检查）
#     本地    : 综合/实现/时序/DRC（需 Vivado）
#   但已经够挡住绝大多数 PR 会引入的问题了。

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:        # 也允许手动点一下跑

jobs:
  sim:
    name: 静态检查 + 全量回归
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog verilator
          echo "--- 版本 ---"
          # ⚠️ GitHub Actions 默认 `bash -eo pipefail`，
          #    `iverilog -V | head -1` 会因为 head 提前退出、iverilog 收到 SIGPIPE
          #    而被判成失败。要么不用管道，要么显式吃掉退出码。
          iverilog -V || true
          verilator --version

      - name: 跑 run_iv.sh（Verilator 检查 + 21 个 testbench）
        # tee 一份到文件，失败那一步才能把完整输出贴出来。
        # GHA 默认 pipefail，所以管道不会把 run_iv.sh 的退出码吞掉。
        run: bash scripts/sim/run_iv.sh 2>&1 | tee /tmp/run.log

      - name: 失败时打印详细日志
        if: failure()
        run: |
          echo "=================== run_iv.sh 输出末尾 ==================="
          tail -60 /tmp/run.log 2>/dev/null || echo "(无)"
          echo
          echo "=================== Verilator 日志 ==================="
          head -60 sim/build/verilator.log 2>/dev/null || echo "(无)"
          echo
          echo "=================== 各 testbench 的 [ERR] ==================="
          for f in sim/build/*.log; do
            if grep -qE '\[ERR\]|\*\*\* FAIL' "$f" 2>/dev/null; then
              echo "--- $f ---"
              # 同样避开 pipefail：先落盘再 head
              grep -E '\[ERR\]|\*\*\* FAIL' "$f" > /tmp/errs.txt 2>/dev/null || true
              head -20 /tmp/errs.txt
            fi
          done
          exit 0
